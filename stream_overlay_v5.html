<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    min-height: 100vh;
    padding: 14px;
    font-family: 'DM Mono', monospace;
  }

  .overlay {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 5px 10px;
    border-radius: 4px;
    animation: fadeIn 0.6s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .text {
    font-size: 11px;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.88);
    letter-spacing: 0.05em;
    line-height: 1;
  }

  .ampm {
    font-size: 9px;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.50);
    letter-spacing: 0.06em;
  }

  .sep {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.22);
  }

  /* ชื่อเมืองและอุณหภูมิ fade in เมื่อโหลดเสร็จ */
  .geo {
    display: flex;
    align-items: center;
    gap: 8px;
    transition: opacity 0.5s ease;
  }
  .geo.hidden { opacity: 0; }
</style>
</head>
<body>

<div class="overlay">
  <!-- เวลา -->
  <span class="text" id="time">--:--</span>
  <span class="ampm" id="ampm">--</span>
  <span class="sep">·</span>

  <!-- วันที่ -->
  <span class="text" id="date">----/--/--</span>

  <!-- เมือง + อุณหภูมิ (โหลดจาก GPS) -->
  <div class="geo hidden" id="geo">
    <span class="sep">·</span>
    <span class="text" id="city">--</span>
    <span class="sep">·</span>
    <span class="text" id="temp">--°C</span>
  </div>
</div>

<script>
// ── Clock ─────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  let h     = now.getHours();
  const m   = String(now.getMinutes()).padStart(2, '0');
  const ap  = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const y   = now.getFullYear();
  const mo  = String(now.getMonth() + 1).padStart(2, '0');
  const d   = String(now.getDate()).padStart(2, '0');
  document.getElementById('time').textContent = `${h}:${m}`;
  document.getElementById('ampm').textContent = ap;
  document.getElementById('date').textContent = `${y}/${mo}/${d}`;
}
updateClock();
setInterval(updateClock, 1000);

// ── Weather + City ────────────────────────────────────────
async function fetchCity(lat, lon) {
  const res  = await fetch(
    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`,
    { headers: { 'Accept-Language': 'en' } }
  );
  const data = await res.json();
  // ลอง city → town → village → state ตามลำดับ
  const addr = data?.address || {};
  return addr.city || addr.town || addr.village || addr.county || addr.state || '';
}

async function fetchTemp(lat, lon) {
  const res  = await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&temperature_unit=celsius`
  );
  const data = await res.json();
  return Math.round(data.current.temperature_2m);
}

async function init() {
  if (!navigator.geolocation) return;

  navigator.geolocation.watchPosition(async (pos) => {
    const { latitude: lat, longitude: lon } = pos.coords;
    try {
      const [city, temp] = await Promise.all([
        fetchCity(lat, lon),
        fetchTemp(lat, lon),
      ]);
      if (city) document.getElementById('city').textContent = city;
      document.getElementById('temp').textContent = `${temp}°C`;
      document.getElementById('geo').classList.remove('hidden');
    } catch { /* ถ้า offline ก็ไม่แสดงส่วน geo */ }
  },
  () => { /* no GPS — ซ่อนส่วน geo ไว้เงียบๆ */ },
  { enableHighAccuracy: true, maximumAge: 300000 });
}

init();
</script>
</body>
</html>
